[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-change-proposals"
version = "0.5.0"
description = "Evidence-backed improvement proposals for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Vittor Faria" }
]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0"
]
keywords = ["ai-agents", "evals", "llmops", "observability", "openinference", "replay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/vittorfp/agent-change-proposals"
Repository = "https://github.com/vittorfp/agent-change-proposals"
Issues = "https://github.com/vittorfp/agent-change-proposals/issues"
Discussions = "https://github.com/vittorfp/agent-change-proposals/discussions"
Roadmap = "https://github.com/vittorfp/agent-change-proposals/blob/main/ROADMAP.md"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0",
  "ruff>=0.8.0"
]

[project.scripts]
acp = "acp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
